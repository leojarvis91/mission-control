<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 SIDDZ — MISSION CONTROL</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --bg-card: #1a1d26;
    --border: #2a2d3a;
    --text-primary: #f0f0f0;
    --text-secondary: #8b8fa8;
    --text-muted: #555870;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --teal: #14b8a6;
    --orange: #f97316;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --col-todo: #2a2d3a;
    --col-inprog: #1e2535;
    --col-done: #141820;
    --col-cancelled: #121419;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  .header {
    padding: 28px 32px 0;
    position: relative;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .title-block h1 {
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.1;
    background: linear-gradient(135deg, #f0f0f0 0%, #8b8fa8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .title-block h1 span.rocket {
    -webkit-text-fill-color: initial;
    color: initial;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 5px;
    letter-spacing: 0.02em;
  }

  .stat-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .stat-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .stat-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    display: inline-block;
  }

  /* ─── FILTER PILLS ─── */
  .filters {
    padding: 20px 32px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 4px;
  }

  .filter-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.18s ease;
    user-select: none;
    letter-spacing: 0.01em;
  }

  .filter-pill:hover {
    border-color: var(--text-secondary);
    color: var(--text-primary);
  }

  .filter-pill.active {
    color: #fff;
    border-color: transparent;
  }

  .filter-pill[data-cat="all"].active       { background: linear-gradient(135deg, #3b4255, #2a2d3a); border-color: #555870; }
  .filter-pill[data-cat="yhangry"].active   { background: linear-gradient(135deg, #1e3a8a55, #3b82f620); border-color: var(--blue); color: var(--blue); }
  .filter-pill[data-cat="content"].active   { background: linear-gradient(135deg, #4c1d9555, #8b5cf620); border-color: var(--purple); color: var(--purple); }
  .filter-pill[data-cat="personal"].active  { background: linear-gradient(135deg, #0d4f4755, #14b8a620); border-color: var(--teal); color: var(--teal); }
  .filter-pill[data-cat="side-project"].active { background: linear-gradient(135deg, #7c2d1255, #f9731620); border-color: var(--orange); color: var(--orange); }

  /* ─── DIVIDER ─── */
  .divider {
    margin: 20px 32px 0;
    height: 1px;
    background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
  }

  /* ─── BOARD ─── */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 20px 32px 40px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .board { grid-template-columns: repeat(2, 1fr); }
    .header, .filters, .divider { padding-left: 16px; padding-right: 16px; }
    .board { padding: 16px; }
  }

  @media (max-width: 520px) {
    .board { grid-template-columns: 1fr; }
  }

  /* ─── COLUMN ─── */
  .column {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: opacity 0.2s ease;
  }

  .column.col-inprogress {
    border-color: transparent;
    animation: glowPulse 3s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0 1px #3b82f622, 0 0 20px #3b82f615; }
    50%       { box-shadow: 0 0 0 1px #3b82f655, 0 0 35px #3b82f628; }
  }

  .col-header {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .col-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .col-inprogress .col-title { color: #60a5fa; }

  .col-count {
    background: #ffffff0f;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 9px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    min-width: 26px;
    text-align: center;
  }

  .col-inprogress .col-count {
    background: #3b82f615;
    border-color: #3b82f640;
    color: #60a5fa;
  }

  .col-cards {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 60px;
  }

  .col-empty {
    text-align: center;
    padding: 24px 12px;
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
  }

  /* ─── CARD ─── */
  .card {
    background: #11141d;
    border: 1px solid var(--border);
    border-radius: 10px;
    border-left: 3px solid transparent;
    padding: 14px 14px 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    cursor: default;
    position: relative;
  }

  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px #00000040;
  }

  .card.cat-yhangry     { border-left-color: var(--blue); }
  .card.cat-content     { border-left-color: var(--purple); }
  .card.cat-personal    { border-left-color: var(--teal); }
  .card.cat-side-project{ border-left-color: var(--orange); }

  .card.done-card {
    opacity: 0.55;
  }

  .card.done-card .card-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .card.cancelled-card {
    opacity: 0.40;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    gap: 6px;
  }

  .cat-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 6px;
  }

  .cat-badge.cat-yhangry      { background: #3b82f620; color: #60a5fa; }
  .cat-badge.cat-content      { background: #8b5cf620; color: #a78bfa; }
  .cat-badge.cat-personal     { background: #14b8a620; color: #2dd4bf; }
  .cat-badge.cat-side-project { background: #f9731620; color: #fb923c; }

  .priority-badge {
    font-size: 11px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
  }

  .card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.35;
    margin-bottom: 7px;
  }

  .card-detail {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    background: #ffffff08;
    border: 1px solid #ffffff10;
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .card-id {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  /* ─── FOOTER ─── */
  .footer {
    text-align: center;
    padding: 0 32px 32px;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  /* ─── HIDDEN ─── */
  .hidden { display: none !important; }
</style>
</head>

// ─── PRIORITY CONFIG ───
const PRIORITY_EMOJI = { HIGH: '🔴', MEDIUM: '🟡', LOW: '⚪' };
const STATUS_COLS = ['TODO', 'IN_PROGRESS', 'DONE', 'CANCELLED'];
const CAT_COLORS = {
  yhangry:      '#3b82f6',
  content:      '#8b5cf6',
  personal:     '#14b8a6',
  'side-project': '#f97316'
};

let activeFilter = 'all';

// ─── FORMAT DATE ───
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ─── RENDER CARD ───
function renderCard(task) {
  const isDone = task.status === 'DONE';
  const isCancelled = task.status === 'CANCELLED';
  const catClass = `cat-${task.category}`;
  const doneClass = isDone ? ' done-card' : '';
  const cancelClass = isCancelled ? ' cancelled-card' : '';
  const priorityEmoji = PRIORITY_EMOJI[task.priority] || '⚪';

  const tagsHtml = (task.tags || [])
    .map(t => `<span class="tag">#${t}</span>`)
    .join('');

  return `
    <div class="card ${catClass}${doneClass}${cancelClass}" data-cat="${task.category}" data-status="${task.status}">
      <span class="card-id">${task.id}</span>
      <div class="card-meta">
        <span class="cat-badge ${catClass}">${task.category}</span>
        <span class="priority-badge">${priorityEmoji} ${task.priority}</span>
      </div>
      <div class="card-title">${escHtml(task.title)}</div>
      <div class="card-detail">${escHtml(task.detail)}</div>
      ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
    </div>`;
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ─── SET FILTER ───
function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === cat);
  });
  renderBoard();
}

// ─── RENDER BOARD ───
function renderBoard() {
  const tasks = TASK_DATA.tasks;
  const filtered = activeFilter === 'all'
    ? tasks
    : tasks.filter(t => t.category === activeFilter);

  STATUS_COLS.forEach(status => {
    const col = filtered.filter(t => t.status === status);
    const container = document.getElementById(`cards-${status}`);
    const counter   = document.getElementById(`count-${status}`);
    counter.textContent = col.length;

    if (col.length === 0) {
      container.innerHTML = `<div class="col-empty">Nothing here</div>`;
    } else {
      container.innerHTML = col.map(renderCard).join('');
    }
  });
}

// ─── STAT PILLS ───
function renderStats() {
  const tasks = TASK_DATA.tasks;
  const total  = tasks.length;
  const active = tasks.filter(t => t.status === 'IN_PROGRESS').length;
  const done   = tasks.filter(t => t.status === 'DONE').length;
  const todo   = tasks.filter(t => t.status === 'TODO').length;

  document.getElementById('statPills').innerHTML = `
    <div class="stat-pill"><span class="dot" style="background:#3b82f6"></span>${active} active</div>
    <div class="stat-pill"><span class="dot" style="background:#f59e0b"></span>${todo} queued</div>
    <div class="stat-pill"><span class="dot" style="background:#22c55e"></span>${done} done</div>
    <div class="stat-pill"><span class="dot" style="background:#555870"></span>${total} total</div>
  `;
}

// ─── INIT ───
